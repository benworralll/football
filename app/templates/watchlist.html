<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchlist</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        {% include "header.html" %}
    </header>
    <nav>
        {% include "nav.html" %}
    </nav>
    <main>
        <h1>Watchlist</h1>
        <div class="watchlist-items">
            {% if watchlist_items %}
                <table>
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in watchlist_items %}
                            <tr>
                                <td>{{ item.team.name if item.team else item.ground.name }}</td>
                                <td>
                                    <form action="{{ url_for('remove_from_watchlist', item_id=item.id) }}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-danger">Remove</button>
                                    </form>
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            {% else %}
                <p>Your watchlist is empty.</p>
            {% endif %}
        </div>
    </main>
    <footer>
        {% include "footer.html" %}
    </footer>
</body>
</html>
